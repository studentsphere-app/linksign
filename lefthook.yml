# lefthook.yml

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  commands:
    biome:
      run: pnpm biome check --error-on-warnings .

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
